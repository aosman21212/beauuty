<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4a0e2e"/>
      <stop offset="50%"  stop-color="#7b2d42"/>
      <stop offset="100%" stop-color="#1a0a10"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <circle cx="200" cy="80"  r="120" fill="#c9657e" opacity="0.07"/>
  <circle cx="1050" cy="300" r="180" fill="#e91e63" opacity="0.06"/>
  <circle cx="700" cy="50"  r="80"  fill="#f8bbd0" opacity="0.05"/>

  <!-- Decorative lines -->
  <line x1="0" y1="350" x2="1200" y2="350" stroke="#f8bbd0" stroke-width="0.5" opacity="0.15"/>

  <!-- ── Lotus icon (right side) ── -->
  <g transform="translate(840, 60)">
    <!-- Outer petals -->
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ffb6c1" opacity="0.8" transform="rotate(-60,160,80)"/>
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ff8fa3" opacity="0.8" transform="rotate(0,160,80)"/>
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ffb6c1" opacity="0.8" transform="rotate(60,160,80)"/>
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ff8fa3" opacity="0.8" transform="rotate(120,160,80)"/>
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ffb6c1" opacity="0.8" transform="rotate(180,160,80)"/>
    <ellipse cx="160" cy="80"  rx="44" ry="26" fill="#ff8fa3" opacity="0.8" transform="rotate(240,160,80)"/>
    <!-- Center -->
    <circle cx="160" cy="80" r="22" fill="#e91e63"/>
    <circle cx="160" cy="80" r="12" fill="#fff" opacity="0.9"/>
    <!-- Glow -->
    <circle cx="160" cy="80" r="56" fill="none" stroke="#f8bbd0" stroke-width="2" opacity="0.3"/>
    <circle cx="160" cy="80" r="70" fill="none" stroke="#f8bbd0" stroke-width="1" opacity="0.15"/>

    <!-- Water drop below -->
    <path d="M 160 155 Q 175 175 160 195 Q 145 175 160 155" fill="#80d8ff" opacity="0.7"/>

    <!-- Sparkles -->
    <text x="230" y="50"  font-size="22" fill="#f8bbd0" opacity="0.8">✦</text>
    <text x="85"  y="35"  font-size="16" fill="#f8bbd0" opacity="0.6">✦</text>
    <text x="250" y="130" font-size="12" fill="#f8bbd0" opacity="0.5">✦</text>
  </g>

  <!-- ── Text block ── -->
  <!-- Icon circle -->
  <circle cx="96" cy="100" r="56" fill="#7b2d42" stroke="#f8bbd0" stroke-width="2"/>
  <!-- Mini lotus in circle -->
  <g transform="translate(64,68)">
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ffb6c1" transform="rotate(-60,32,32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ff8fa3" transform="rotate(0,32,32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ffb6c1" transform="rotate(60,32,32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ff8fa3" transform="rotate(120,32,32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ffb6c1" transform="rotate(180,32,32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="8" fill="#ff8fa3" transform="rotate(240,32,32)"/>
    <circle cx="32" cy="32" r="8" fill="#e91e63"/>
    <circle cx="32" cy="32" r="4" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Main title -->
  <text x="170" y="82" font-size="54" fill="#ffffff" font-weight="800"
        font-family="Georgia,serif">Beauty Spa</text>
  <text x="170" y="142" font-size="54" fill="#f8bbd0" font-weight="800"
        font-family="Georgia,serif">Management</text>

  <!-- Subtitle -->
  <text x="170" y="188" font-size="20" fill="#e8a0b0"
        font-family="Arial,sans-serif">Appointments · Services · Packages · Invoicing</text>

  <!-- Badge pills -->
  <rect x="170" y="215" width="160" height="34" rx="17" fill="#e91e6322"
        stroke="#e91e63" stroke-width="1.5"/>
  <text x="250" y="237" font-size="13" fill="#f8bbd0" text-anchor="middle"
        font-family="Arial,sans-serif">🌸 Calendar View</text>

  <rect x="342" y="215" width="170" height="34" rx="17" fill="#f0627722"
        stroke="#f06292" stroke-width="1.5"/>
  <text x="427" y="237" font-size="13" fill="#f8bbd0" text-anchor="middle"
        font-family="Arial,sans-serif">💆 Therapist Mgmt</text>

  <rect x="524" y="215" width="155" height="34" rx="17" fill="#ad145722"
        stroke="#ad1457" stroke-width="1.5"/>
  <text x="602" y="237" font-size="13" fill="#f8bbd0" text-anchor="middle"
        font-family="Arial,sans-serif">🧴 Packages &amp; SPA</text>

  <!-- Odoo 19 badge -->
  <rect x="1070" y="18" width="120" height="34" rx="17" fill="#e91e63"/>
  <text x="1130" y="40" font-size="14" fill="#fff" text-anchor="middle"
        font-weight="bold" font-family="Arial,sans-serif">Odoo 19.0</text>

  <!-- Bottom accent -->
  <rect x="0" y="390" width="1200" height="10" fill="#e91e63" opacity="0.6"/>
</svg>
